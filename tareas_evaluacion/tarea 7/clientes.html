<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Clientes</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Clientes</h1>
    </header>
    <main>
        <div id="contenedorClientes">
            <h2>Tabla clientes</h2>
            <table id="tabla">
                <thead>
                    <tr>
                        <th>Nombre</th>
                        <th>Apellidos</th>
                        <th>Email</th>
                        <th>Dirección</th>
                        <th>Ciudad</th>
                        <th>Teléfono</th>
                    </tr>
                </thead>
                <tbody></tbody>
            </table>
        </div>
        <div id="contenedorForm">
            <form action="procesar.php" method="POST" id="formulario">
                <h2>Agrega un nuevo cliente</h2>
                <div class="center">
                    <input type="text" name="nombre" id="nombre" placeholder="Nombre" required />
                    <input type="text" name="apellidos" id="apellidos" placeholder="Apellidos" required /><br />
                    <input type="email" name="email" id="email" placeholder="Correo electrónico" required />
                    <input type="text" name="direccion" id="direccion" placeholder="Dirección" required /><br />
                    <input type="text" name="ciudad" id="ciudad" placeholder="Ciudad" required />
                    <input type="text" name="telefono" id="telefono" placeholder="Teléfono" required /><br />
                    <button type="submit" id="guardar">Guardar cliente</button>
                </div>
            </form>
        </div>
    </main>

    <script>
        const tbody = document.querySelector("tbody");
        let clientes = [];

        // Cargar clientes desde JSON al cargar la página
        fetch('datos_clientes.json')
            .then(res => res.json())
            .then(datos => {
                clientes = datos;
                mostrarClientes();
            });

        function mostrarClientes() {
            tbody.innerHTML = "";
            clientes.forEach(cliente => {
                const fila = `
                    <tr>
                        <td>${cliente.nombre}</td>
                        <td>${cliente.apellidos}</td>
                        <td>${cliente.email}</td>
                        <td>${cliente.direccion}</td>
                        <td>${cliente.ciudad}</td>
                        <td>${cliente.telefono}</td>
                    </tr>`;
                tbody.innerHTML += fila;
            });
        }
    </script>
</body>
</html>
