<!doctype html>
<html lang="es">
  <head>
    <title>Galería dinámica con JSON</title>
    <meta charset="utf-8">
    <style> 
      /* --- Fondo negro general --- */
      body{background:black;margin:0;}

      /* --- Contenedor principal con grid --- */
      main{
        display:grid;
        grid-template-columns:repeat(auto-fill, minmax(150px, 1fr));
        gap:20px;
        padding:20px;
      }

      /* --- Estilo de las miniaturas --- */
      main img{
        width:100%;
        transition:all 0.5s;
        border-radius:5px;
        border:1px solid white;
        cursor:pointer;
      }

      /* --- Efecto zoom al pasar el ratón --- */
      main img:hover{
        transform:scale(1.1);
      }

      /* --- Imagen principal dentro del modal --- */
      #modal img{height:90%;}

      /* --- Contenedor oscuro del modal (fondo difuminado) --- */
      #contenedormodal{
        position:fixed;
        width:100%;
        height:100%;
        background:rgba(0,0,0,0.5);
        top:0;
        left:0;
        display:none;
        align-items:center;
        justify-content:center;
        backdrop-filter: blur(5px);
      }

      /* --- Caja blanca del modal --- */
      #modal{
        width:400px;
        height:400px;
        background:white;
        padding:20px;
        border-radius:10px;
        box-shadow:0px 10px 20px black;
        text-align:center;
        display:flex;
        justify-content:space-between;
        align-items:center;
      }

      /* --- Botones de navegación del modal --- */
      #modal button{
        border:none;
        background:white;
        box-shadow:0px 2px 4px black;
        border-radius:50%;
        width:30px;
        height:30px;
        cursor:pointer;
      }

      /* --- Contenedor central de la imagen en el modal --- */
      #contienepieza{
        width:100%;
        height:100%;
      }
    </style>
  </head>

  <body>
    <main id="galeria"></main> <!-- Aquí se insertarán las imágenes dinámicamente -->

    <!-- === MODAL === -->
    <div id="contenedormodal">
      <div id="modal">
        <button id="anterior">⬅</button>
        <div id="contienepieza">
          <img src="">
          <p></p>
        </div>
        <button id="siguiente">➡</button>
      </div>
    </div>

    <script>
      // ----------------------------
      // VARIABLES PRINCIPALES
      // ----------------------------
      const contenedorGaleria = document.getElementById("galeria"); // contenedor donde irán las imágenes
      const contenedorModal = document.getElementById("contenedormodal"); // fondo negro del modal
      const imagenModal = document.querySelector("#modal img"); // imagen dentro del modal
      const textoModal = document.querySelector("#contienepieza p"); // texto debajo de la imagen
      const botonAnterior = document.getElementById("anterior");
      const botonSiguiente = document.getElementById("siguiente");

      let imagenActiva = null; // imagen actualmente mostrada en el modal

      // ----------------------------
      // CARGA DE IMÁGENES DESDE JSON
      // ----------------------------
      fetch("imagenes.json")
        .then(respuesta => respuesta.json()) // convertimos el archivo a JSON
        .then(listaImagenes => {
          // Por cada elemento del JSON creamos una etiqueta <img>
          listaImagenes.forEach(imagenDatos => {
            const nuevaImagen = document.createElement("img");
            nuevaImagen.src = imagenDatos.src; // asignamos el src
            nuevaImagen.alt = imagenDatos.alt; // asignamos el texto alternativo
            contenedorGaleria.appendChild(nuevaImagen); // la añadimos al <main>
          });

          // Una vez creadas, activamos los eventos de clic en cada imagen
          activarEventosImagenes();
        })
        .catch(error => console.error("Error al cargar imagenes.json:", error));

      // ----------------------------
      // FUNCIÓN QUE AÑADE LOS EVENTOS DE CLIC A LAS IMÁGENES
      // ----------------------------
      function activarEventosImagenes() {
        const imagenes = document.querySelectorAll("main img");

        imagenes.forEach(imagen => {
          imagen.onclick = function() {
            imagenActiva = this; // marcamos cuál está activa
            contenedorModal.style.display = "flex"; // mostramos el modal
            imagenModal.src = this.src; // ponemos la imagen en grande
            textoModal.textContent = this.alt; // mostramos el texto descriptivo
          };
        });
      }

      // ----------------------------
      // CERRAR MODAL AL CLICAR FUERA
      // ----------------------------
      contenedorModal.onclick = function() {
        this.style.display = "none"; // ocultamos el modal
      };

      // ----------------------------
      // BOTÓN SIGUIENTE
      // ----------------------------
      botonSiguiente.onclick = function(event) {
        const siguiente = imagenActiva.nextElementSibling; // busca la siguiente imagen
        if (siguiente) { // si existe
          imagenModal.src = siguiente.src;
          textoModal.textContent = siguiente.alt;
          imagenActiva = siguiente;
        } else {
          alert("🚫 No hay más imágenes a la derecha.");
        }
        event.stopPropagation(); // evita que se cierre el modal
      };

      // ----------------------------
      // BOTÓN ANTERIOR
      // ----------------------------
      botonAnterior.onclick = function(event) {
        const anterior = imagenActiva.previousElementSibling; // busca la anterior imagen
        if (anterior) {
          imagenModal.src = anterior.src;
          textoModal.textContent = anterior.alt;
          imagenActiva = anterior;
        } else {
          alert("🚫 No hay más imágenes a la izquierda.");
        }
        event.stopPropagation();
      };
    </script>
  </body>
</html>
